<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactor Incremental</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="app" class="game-container">
        <header class="game-header">
            <h1>Reactor Incremental</h1>
            <div class="header-stats">
                <div class="stat">
                    <span class="label">Energy:</span>
                    <span id="stat-energy" class="value">0</span>
                </div>
                <div class="stat">
                    <span class="label">Power:</span>
                    <span id="stat-power" class="value">0/s</span>
                </div>
            </div>
        </header>

        <main class="game-main">
            <section class="panel reactor-panel">
                <h2>Reactor</h2>
                <div id="reactor-status" class="reactor-status">
                    <div class="reactor-visual"></div>
                    <div class="reactor-info">
                        <p id="reactor-temp">Temperature: 0°C</p>
                        <p id="reactor-fuel">Fuel: 0%</p>
                    </div>
                </div>
                <button id="btn-generate" class="btn btn-primary">Generate Energy</button>
            </section>

            <section class="panel upgrades-panel">
                <h2>Upgrades</h2>
                <div id="upgrades-list" class="upgrades-list">
                    <!-- Generated by JS -->
                </div>
            </section>

            <section class="panel stats-panel">
                <h2>Statistics</h2>
                <div id="stats-display" class="stats-display">
                    <p id="stat-total-generated">Total Generated: 0</p>
                    <p id="stat-time-played">Time Played: 0s</p>
                    <p id="stat-efficiency">Efficiency: 100%</p>
                </div>
            </section>
        </main>

        <footer class="game-footer">
            <button id="btn-save" class="btn btn-secondary">Save</button>
            <button id="btn-load" class="btn btn-secondary">Load</button>
            <button id="btn-reset" class="btn btn-danger">Reset</button>
            <span id="save-status" class="save-status"></span>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/utils/Config.js"></script>
    <script src="js/utils/Math.js"></script>
    <script src="js/utils/Format.js"></script>
    <script src="js/core/Events.js"></script>
    <script src="js/core/Player.js"></script>
    <script src="js/systems/Save.js"></script>
    <script src="js/systems/Reactor.js"></script>
    <script src="js/systems/Energy.js"></script>
    <script src="js/systems/UI.js"></script>
    <script src="js/core/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
